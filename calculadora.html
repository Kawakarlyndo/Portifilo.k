<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Dias</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #2e2d2e;
        }
        #btn-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #2f333f;
            color: rgb(50, 112, 170);
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        #calculator {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgb(79, 73, 94);
            padding: 30px;
            box-shadow: 0 0 15px rgb(103, 171, 235);
            border-radius: 10px;
            text-align: center;
        }
        input, button {
            margin: 10px 0;
            background-color: #6f6c83;
            color: #000000;
            padding: 10px;
        }
        button {
            background-color: #302872;
            color: rgb(97, 110, 136);
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            opacity: 0.9;
        }

        .text{
            font-family: Times New Roman;
            color: #5c647a;
        }

        p1{
            padding: 50px;
        }

    </style>
</head>
<body>
    <h1 class="text">Como funciona</h1>
    <p1 class="text" name="texsec">aperte o botao aseguir logo depois insira as datas que deseja saber a quantidade de dia entre elas e entao aperte calcular</p1>

    <h1 class="text">Problema</h1>
    <p1 class="text" name="texsec">Esse projeto busca ajudar as pessoas a saber a quantidade de dias entre duas datas ainda mais se sao quantidades grandes</p1>

    <button id="btn-toggle">Abrir Calculadora</button>

    <div id="calculator">
        <h2>Calculadora de Dias</h2>
        <label for="start-date">Data Inicial:</label>
        <input type="date" id="start-date">
        
        <label for="end-date">Data Final:</label>
        <input type="date" id="end-date">
        
        <button onclick="calculateDays()">Calcular</button>
        
        <p id="result"></p>
    </div>

    <script>
        const calculator = document.getElementById('calculator');
        const toggleButton = document.getElementById('btn-toggle');

        toggleButton.addEventListener('click', function() {
            if (calculator.style.display === 'none' || calculator.style.display === '') {
                calculator.style.display = 'block';
                toggleButton.innerText = 'Fechar Calculadora';
            } else {
                calculator.style.display = 'none';
                toggleButton.innerText = 'Abrir Calculadora';
            }
        });

        function calculateDays() {
            const startDate = new Date(document.getElementById('start-date').value);
            const endDate = new Date(document.getElementById('end-date').value);

            if (!startDate || !endDate || isNaN(startDate) || isNaN(endDate)) {
                document.getElementById('result').innerText = "Por favor, insira datas válidas.";
                return;
            }

            const difference = endDate - startDate;
            const days = difference / (1000 * 60 * 60 * 24);

            if (days < 0) {
                document.getElementById('result').innerText = "A data final deve ser posterior à data inicial.";
            } else {
                document.getElementById('result').innerText = `Diferença: ${days} dias`;
            }
        }
    </script>

</body>
</html>
